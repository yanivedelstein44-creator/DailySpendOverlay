# בדיקה על אמולטור אנדרואיד – מופעלת ידנית (Actions → Emulator test → Run workflow, או gh workflow run).
# לא נוגעת בטלפון של המשתמש ולא בכסף אמיתי: ה"תשלומים" הם התראות טקסט באמולטור.
# התוצאה: צילומי מסך + לוגים בתוך Artifact בשם emulator-results.
name: Emulator test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run scenario on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/emulator-test.sh

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-results
          path: emulator-results/
          if-no-files-found: warn
