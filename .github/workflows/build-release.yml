# בונה APK חתום בכל דחיפה ל-main ומפרסם אותו כ-Release.
# האפליקציה בטלפון בודקת את ה-Release האחרון (אחרי אישור המשתמש) ומציעה להתקין.
#
# הגדרה חד-פעמית בריפו: Settings → Secrets and variables → Actions → New repository secret
#   שם: KEYSTORE_PASSWORD   ערך: הסיסמה מתוך keystore/keystore.properties
#
# Release חדש נוצר רק כש-versionCode ב-version.properties עולה (אחרת רק בנייה ובדיקות).
name: Build & Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests + compile check (no signing needed)
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest compileReleaseKotlin

      - name: Lint (report only)
        continue-on-error: true
        run: |
          ./gradlew --no-daemon lintDebug || true
          cat app/build/reports/lint-results-debug.txt 2>/dev/null | tail -150 || true

      - name: Check signing secret
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Missing secret KEYSTORE_PASSWORD (Settings → Secrets and variables → Actions)"
            exit 1
          fi

      - name: Build signed APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease -PupdateRepo=${{ github.repository }}

      - name: Show APK permissions
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$AAPT" ]; then echo "Permissions in APK:"; "$AAPT" dump permissions "$APK" || true; fi

      - name: Prepare release files
        id: prep
        run: |
          set -e
          CODE=$(grep -E '^versionCode=' version.properties | cut -d= -f2 | tr -d '[:space:]')
          NAME=$(grep -E '^versionName=' version.properties | cut -d= -f2 | tr -d '[:space:]')
          TAG="v${NAME}-${CODE}"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/DailySpendOverlay.apk
          SHA=$(sha256sum dist/DailySpendOverlay.apk | cut -d' ' -f1)
          touch release-notes.txt
          python3 - "$CODE" "$NAME" "$TAG" "$SHA" <<'PY'
          import json, sys
          code, name, tag, sha = sys.argv[1:5]
          notes = open("release-notes.txt", encoding="utf-8").read().strip()
          data = {"versionCode": int(code), "versionName": name, "tag": tag,
                  "apk": "DailySpendOverlay.apk", "sha256": sha, "notes": notes}
          with open("dist/version.json", "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
          with open("dist/notes.md", "w", encoding="utf-8") as f:
              f.write(notes + "\n\nSHA-256: `" + sha + "`\n")
          PY
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Publish release (only for a new versionCode)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.prep.outputs.tag }}
          NAME: ${{ steps.prep.outputs.name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists – bump versionCode in version.properties to publish a new one."
            exit 0
          fi
          gh release create "$TAG" dist/DailySpendOverlay.apk dist/version.json \
            --title "Cash Effect $NAME" \
            --notes-file dist/notes.md \
            --latest
